[project]
name = "brca-spatial-evidence"
version = "0.1.0"
description = "Study 3 of a breast-cancer series: where study 2's candidate drug targets are expressed in tissue, whether that predicts their replication and dependency, and whether a pathology foundation model can see them in H&E. Pre-registered, CPU-only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "scanpy>=1.10",
    "anndata>=0.10",
    "h5py>=3",
    "matplotlib>=3.9",
    "requests>=2.32",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# tile extraction and the frozen encoders (CPU)
histology = ["torch>=2.2", "timm>=1.0", "transformers>=4.44", "huggingface-hub>=0.24", "pillow>=10", "tifffile>=2024.1", "imagecodecs>=2024.1"]

[project.scripts]
bse = "bse.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs/site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# a table of URLs and file names: long lines are the readable form
"src/bse/sources.py" = ["E501"]
# long f-strings assembling result rows
"src/bse/stages/compartment.py" = ["E501"]
"src/bse/stages/tiles.py" = ["E501"]
"src/bse/stages/histology.py" = ["E501"]
